apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather_app
  labels:
    app: weather_app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather_app
  template:
    metadata:
      labels:
        app: weather_app
    spec:
      containers:
        - name: weather_app
          image: leaflink/weather_app:latest
          ports:
            - containerPort: 3000
          env:
            - name: SECURE_WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: api-key
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
